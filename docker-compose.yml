services:
  model_service:
    image: ghcr.io/jayoza/ds-model:latest
    build: ./model_service
    ports: ["5001:5001"]
    restart: unless-stopped
  gateway:
    image: ghcr.io/jayoza/ds-gateway:latest
    build: ./gateway
    environment:
      MODEL_URL: http://model_service:5001
    ports: ["8000:8000"]
    depends_on: [model_service]
    restart: unless-stopped
